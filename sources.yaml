# AI Observatory feed sources.
#
# Operational list per docs/source-selection.md: P1 RSS/Atom + JSON-API
# sources, plus a P2 tier of additional RSS/Atom feeds. `collector: hf_papers`
# and `collector: hn_algolia` are dedicated JSON-API collectors (bespoke
# response shapes); `collector: rss` covers every RSS/Atom feed. See
# docs/source-selection.md for the full candidate list, priorities, and the
# rationale for the bridge/manual tiers not included here.
#
# category values follow the daily-record grouping order: lab, research,
# newsletter, news, tooling, community.

- name: OpenAI
  collector: rss
  url: https://openai.com/news/rss.xml
  category: lab
  priority: 1

