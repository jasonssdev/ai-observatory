name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran and what you expected instead.
      placeholder: |
        1. uv run ai-observatory collect
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste any error message or log output. This will be formatted as code automatically.
      render: shell
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11..."
    validations:
      required: true
  - type: dropdown
    id: ollama
    attributes:
      label: Ollama
      description: Is Ollama installed and running? (The filter degrades gracefully without it.)
      options:
        - Yes, running
        - Installed but not running
        - Not installed
    validations:
      required: true
